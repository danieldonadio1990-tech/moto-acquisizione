name: CI

# Verifica automatica a ogni push e pull request.
# Nessun segreto, nessun database o storage esterno: i test usano PGlite e una cartella temporanea.
on:
  # push solo su main: sui branch con una PR aperta il CI parte già con l'evento pull_request (niente doppio run)
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa dipendenze
        run: npm ci

      # PageProps / RouteContext / LayoutProps sono tipi generati da Next: senza questo passo il typecheck fallisce
      - name: Genera i tipi Next.js
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  # Analisi statica degli script shell (backup/ripristino): ShellCheck è preinstallato sull'immagine ubuntu-24.04
  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 --no-run-if-empty shellcheck -x
