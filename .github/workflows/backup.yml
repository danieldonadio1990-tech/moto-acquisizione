name: Backup database

# Copia notturna del database PostgreSQL, cifrata con age (chiave pubblica).
# Le FOTO non sono incluse: stanno nel bucket "photos". Vedi README → Backup.
on:
  schedule:
    - cron: "17 2 * * *" # ogni notte, 02:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # deve essere >= alla versione PostgreSQL del progetto Neon (Neon → Settings → PostgreSQL version)
      PG_MAJOR: "17"
      BACKUP_OUT_DIR: backup-out
      # I secret NON sono qui: ogni step riceve solo quelli che usa (niente segreti durante apt-get/curl)
    steps:
      - uses: actions/checkout@v4

      - name: Installa client PostgreSQL e age
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q
          sudo apt-get install -y -q "postgresql-client-${PG_MAJOR}" age
          echo "/usr/lib/postgresql/${PG_MAJOR}/bin" >> "$GITHUB_PATH"

      - name: Dump e cifratura
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
        run: scripts/backup/backup.sh

      - name: Carica su Supabase Storage (bucket backups) e ruota le copie
        env:
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
        run: scripts/backup/upload.sh

      - name: Carica come artifact GitHub (cifrato)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: backup-out/*.dump.age
          retention-days: 30
          if-no-files-found: error
