name: Pulizia foto scadute

# Cancella automaticamente le foto delle richieste più vecchie di 15 giorni (file nello storage + riga DB).
# Chiama la rotta protetta del sito: vedi src/app/api/internal/photos/cleanup/route.ts.
#
# Disattivato finché non si configura (nessun segreto è nel repository):
#   Variabili di repository: PHOTO_CLEANUP_ENABLED=true (accende SIA la pianificazione SIA il lancio manuale:
#                             senza, nessuna esecuzione chiama la rotta, nemmeno da "Run workflow") e
#                             PHOTO_CLEANUP_URL=https://<sito>
#   Secret di repository:    PHOTO_CLEANUP_TOKEN (lo stesso valore della variabile PHOTO_CLEANUP_TOKEN su Netlify)
on:
  schedule:
    - cron: "41 3 * * *" # una volta al giorno, 03:41 UTC (fuori dagli orari di punta)
  workflow_dispatch: {}

permissions:
  contents: read

# Due esecuzioni non si sovrappongono (la pulizia è comunque idempotente: una foto già cancellata non viene ritrovata)
concurrency:
  group: photo-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    # Nessuna esecuzione, pianificata O manuale, chiama la rotta se PHOTO_CLEANUP_ENABLED non è ESATTAMENTE "true":
    # il lancio manuale (workflow_dispatch) resta disponibile nell'interfaccia di Actions, ma è soggetto alla stessa
    # condizione, non un modo per aggirarla. Variabile assente, vuota o diversa da "true" → nessuna chiamata.
    # Solo dal ramo principale: l'elenco delle origini autorizzate (scripts/photo-cleanup/allowed-origins.txt) è quello
    # rivisto e approvato con la PR, non quello di un ramo qualsiasi.
    if: github.ref == 'refs/heads/main' && vars.PHOTO_CLEANUP_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Chiama la rotta di pulizia
        env:
          PHOTO_CLEANUP_URL: ${{ vars.PHOTO_CLEANUP_URL }}
          PHOTO_CLEANUP_TOKEN: ${{ secrets.PHOTO_CLEANUP_TOKEN }}
        run: bash scripts/photo-cleanup/call.sh
